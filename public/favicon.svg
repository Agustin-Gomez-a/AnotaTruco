<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1b4d2e"/>
      <stop offset="70%" stop-color="#0a1f13"/>
      <stop offset="100%" stop-color="#050d08"/>
    </radialGradient>
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="woodGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fae8cf"/>
      <stop offset="50%" stop-color="#d4a373"/>
      <stop offset="100%" stop-color="#a97142"/>
    </linearGradient>
    <radialGradient id="headGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="60%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#172554"/>
    </radialGradient>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="110" fill="url(#bgGlow)" stroke="url(#goldRim)" stroke-width="14"/>

  <!-- Group of 5 Matchsticks -->
  <g transform="translate(136, 136)">
    <rect x="0" y="0" width="22" height="240" rx="4" fill="url(#woodGrad)"/>
    <circle cx="11" cy="0" r="16" fill="url(#headGrad)"/>

    <rect x="0" y="0" width="240" height="22" rx="4" fill="url(#woodGrad)"/>
    <circle cx="240" cy="11" r="16" fill="url(#headGrad)"/>

    <rect x="218" y="0" width="22" height="240" rx="4" fill="url(#woodGrad)"/>
    <circle cx="229" cy="240" r="16" fill="url(#headGrad)"/>

    <rect x="0" y="218" width="240" height="22" rx="4" fill="url(#woodGrad)"/>
    <circle cx="0" cy="229" r="16" fill="url(#headGrad)"/>

    <g transform="rotate(45, 10, 10)">
      <rect x="10" y="10" width="310" height="22" rx="4" fill="url(#woodGrad)"/>
      <circle cx="320" cy="21" r="16" fill="url(#headGrad)"/>
    </g>
  </g>
</svg>
