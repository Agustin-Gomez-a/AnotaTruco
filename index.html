<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>AnotaTruco 🧉 - Anotador Criollo</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- React & Babel -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Google Fonts: Fuentes bien argentas / de pulpería -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Montserrat:wght@400;600;800;900&family=Playfair+Display:ital,wght@1,900&display=swap"
        rel="stylesheet">

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #12100e;
            background-image:
                radial-gradient(circle at 50% 50%, rgba(20, 45, 20, 0.4) 0%, rgba(10, 15, 10, 0.95) 100%),
                repeating-linear-gradient(45deg, rgba(0, 0, 0, 0.05) 0px, rgba(0, 0, 0, 0.05) 2px, transparent 2px, transparent 4px);
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .font-truco {
            font-family: 'Cinzel', serif;
        }

        .font-fileteado {
            font-family: 'Playfair Display', serif;
        }

        /* Textura de mesa de truco / paño */
        .felt-table {
            background: radial-gradient(circle, #1a472a 0%, #0d2818 100%);
            box-shadow: inset 0 0 40px rgba(0, 0, 0, 0.8), 0 10px 25px rgba(0, 0, 0, 0.5);
            border: 6px solid #5c3a21;
        }

        /* Animación al sumar/restar */
        .pop-anim {
            transition: transform 0.1s ease-out;
        }

        .pop-anim:active {
            transform: scale(0.92);
        }

        /* Grilla de fósforos */
        .match-box {
            position: relative;
            width: 52px;
            height: 52px;
            margin: 4px;
        }

        /* Estilo de cada fósforo */
        .stick {
            position: absolute;
            background: #e6c594;
            border-radius: 2px;
            box-shadow: 1px 1px 3px rgba(0, 0, 0, 0.5);
        }

        /* Cabeza del fósforo (Pólvora azul/celeste bien argenta) */
        .stick::after {
            content: '';
            position: absolute;
            background: #0080ff;
            border-radius: 50%;
            box-shadow: 0 0 2px rgba(0, 0, 0, 0.6);
        }

        /* 1. Izquierda (Vertical) */
        .stick-1 {
            top: 4px;
            bottom: 4px;
            left: 4px;
            width: 5px;
        }

        .stick-1::after {
            top: -2px;
            left: -1px;
            width: 7px;
            height: 7px;
        }

        /* 2. Arriba (Horizontal) */
        .stick-2 {
            top: 4px;
            left: 4px;
            right: 4px;
            height: 5px;
        }

        .stick-2::after {
            right: -2px;
            top: -1px;
            width: 7px;
            height: 7px;
        }

        /* 3. Derecha (Vertical) */
        .stick-3 {
            top: 4px;
            bottom: 4px;
            right: 4px;
            width: 5px;
        }

        .stick-3::after {
            bottom: -2px;
            left: -1px;
            width: 7px;
            height: 7px;
        }

        /* 4. Abajo (Horizontal) */
        .stick-4 {
            bottom: 4px;
            left: 4px;
            right: 4px;
            height: 5px;
        }

        .stick-4::after {
            left: -2px;
            top: -1px;
            width: 7px;
            height: 7px;
        }

        /* 5. Diagonal (Cierra el grupo de 5) */
        .stick-5 {
            top: 6px;
            left: 6px;
            width: 58px;
            height: 5px;
            transform-origin: top left;
            transform: rotate(45deg);
            background: #dfb274;
            z-index: 10;
        }

        .stick-5::after {
            right: -2px;
            top: -1px;
            width: 7px;
            height: 7px;
            background: #005bb5;
        }
    </style>
</head>

<body class="text-amber-100 min-h-screen flex flex-col items-center justify-between p-2 sm:p-4">
    <div id="root" class="w-full max-w-4xl flex-1 flex flex-col"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Componente para representar un grupo de fósforos (hasta 5)
        function MatchGroup({ count }) {
            return (
                <div className="match-box flex-shrink-0">
                    {count >= 1 && <div className="stick stick-1"></div>}
                    {count >= 2 && <div className="stick stick-2"></div>}
                    {count >= 3 && <div className="stick stick-3"></div>}
                    {count >= 4 && <div className="stick stick-4"></div>}
                    {count >= 5 && <div className="stick stick-5"></div>}
                </div>
            );
        }

        // Componente para renderizar la columna completa de fósforos de un jugador
        function MatchBoard({ score, target }) {
            const groups = [];
            const totalFives = Math.floor(score / 5);
            const remainder = score % 5;

            for (let i = 0; i < totalFives; i++) {
                groups.push(5);
            }
            if (remainder > 0) {
                groups.push(remainder);
            }

            // División de "Malas" y "Buenas" si es a 30 o 18
            const hasHalves = target === 30 || target === 18;
            const halfTarget = target / 2;
            const scoreInMalas = hasHalves ? Math.min(score, halfTarget) : score;
            const scoreInBuenas = hasHalves ? Math.max(0, score - halfTarget) : 0;

            const renderFosforos = (pts) => {
                const full = Math.floor(pts / 5);
                const rem = pts % 5;
                const list = [];
                for (let i = 0; i < full; i++) list.push(5);
                if (rem > 0) list.push(rem);

                if (list.length === 0) {
                    return <div className="h-14 flex items-center justify-center text-xs text-emerald-800/60 font-semibold italic">- Vacío -</div>;
                }

                return (
                    <div className="flex flex-wrap justify-center content-start gap-1 min-h-[60px] p-1">
                        {list.map((cnt, idx) => (
                            <MatchGroup key={idx} count={cnt} />
                        ))}
                    </div>
                );
            };

            if (!hasHalves) {
                return (
                    <div className="flex-1 bg-black/20 rounded-lg p-2 border border-amber-900/30 overflow-y-auto">
                        {renderFosforos(score)}
                    </div>
                );
            }

            return (
                <div className="flex-1 flex flex-col gap-2 overflow-y-auto">
                    {/* Malas */}
                    <div className="bg-black/25 rounded-lg p-2 border border-amber-900/40">
                        <span className="text-[10px] tracking-widest uppercase font-bold text-amber-500/80 block text-center mb-1">
                            A Las Malas ({scoreInMalas}/{halfTarget})
                        </span>
                        {renderFosforos(scoreInMalas)}
                    </div>

                    {/* Buenas */}
                    <div className="bg-black/25 rounded-lg p-2 border border-amber-900/40">
                        <span className="text-[10px] tracking-widest uppercase font-bold text-sky-400/80 block text-center mb-1">
                            A Las Buenas ({scoreInBuenas}/{halfTarget})
                        </span>
                        {renderFosforos(scoreInBuenas)}
                    </div>
                </div>
            );
        }

        function App() {
            const [numPlayers, setNumPlayers] = useState(2); // 2 o 3 (Pica-pica / Gallo)
            const [target, setTarget] = useState(30);
            const [customTarget, setCustomTarget] = useState("");
            const [players, setPlayers] = useState([
                { id: 1, name: "Nosotros", score: 0 },
                { id: 2, name: "Ellos", score: 0 }
            ]);
            const [winner, setWinner] = useState(null);
            const [history, setHistory] = useState([]);

            // Ajustar estructura según cantidad de jugadores
            const handlePlayerMode = (num) => {
                setNumPlayers(num);
                if (num === 2) {
                    setPlayers([
                        { id: 1, name: "Nosotros", score: 0 },
                        { id: 2, name: "Ellos", score: 0 }
                    ]);
                } else {
                    setPlayers([
                        { id: 1, name: "Jugador 1", score: 0 },
                        { id: 2, name: "Jugador 2", score: 0 },
                        { id: 3, name: "Jugador 3", score: 0 }
                    ]);
                }
                setWinner(null);
                setHistory([]);
            };

            const setTargetPoints = (pts) => {
                setTarget(pts);
                resetGame(pts);
            };

            const handleCustomTarget = (e) => {
                const val = parseInt(e.target.value, 10);
                setCustomTarget(e.target.value);
                if (!isNaN(val) && val > 0) {
                    setTarget(val);
                    resetGame(val);
                }
            };

            const modifyScore = (id, delta) => {
                if (winner) return;

                setPlayers(prev => {
                    const next = prev.map(p => {
                        if (p.id !== id) return p;
                        const newScore = Math.max(0, Math.min(target, p.score + delta));
                        if (newScore >= target) {
                            setWinner(p.name);
                        }
                        return { ...p, score: newScore };
                    });
                    setHistory(h => [...h, prev]);
                    return next;
                });
            };

            const undo = () => {
                if (history.length === 0) return;
                const previousState = history[history.length - 1];
                setPlayers(previousState);
                setHistory(history.slice(0, -1));
                setWinner(null);
            };

            const resetGame = (newTarget = target) => {
                setPlayers(prev => prev.map(p => ({ ...p, score: 0 })));
                setWinner(null);
                setHistory([]);
            };

            const updateName = (id, newName) => {
                setPlayers(prev => prev.map(p => p.id === id ? { ...p, name: newName } : p));
            };

            return (
                <div className="flex flex-col h-full flex-1">
                    {/* Header Criollo */}
                    <header className="text-center py-2 relative">
                        <div className="inline-flex items-center justify-center gap-2">
                            <span className="text-2xl">🧉</span>
                            <h1 className="text-3xl sm:text-4xl font-extrabold tracking-wider font-truco bg-gradient-to-r from-amber-200 via-yellow-400 to-amber-500 bg-clip-text text-transparent drop-shadow-md">
                                ANOTATRUCO
                            </h1>
                            <span className="text-2xl">🇦🇷</span>
                        </div>
                        <p className="text-xs text-amber-300/70 font-semibold tracking-widest uppercase mt-0.5">
                            El Anotador Oficial del Truco Argentino
                        </p>
                    </header>

                    {/* Barra de Controles y Ajustes */}
                    <div className="bg-stone-900/90 rounded-2xl p-3 my-2 border border-amber-800/40 shadow-lg flex flex-wrap items-center justify-between gap-3 text-xs">
                        {/* Modo Jugadores */}
                        <div className="flex items-center gap-1 bg-stone-950 p-1 rounded-xl border border-stone-800">
                            <button
                                onClick={() => handlePlayerMode(2)}
                                className={`px-3 py-1.5 rounded-lg font-bold transition-all ${numPlayers === 2 ? 'bg-amber-600 text-white shadow' : 'text-stone-400 hover:text-white'}`}>
                                2 Equipos
                            </button>
                            <button
                                onClick={() => handlePlayerMode(3)}
                                className={`px-3 py-1.5 rounded-lg font-bold transition-all ${numPlayers === 3 ? 'bg-amber-600 text-white shadow' : 'text-stone-400 hover:text-white'}`}>
                                3 Jugadores (Trío)
                            </button>
                        </div>

                        {/* Puntos Objetivo */}
                        <div className="flex items-center gap-1.5 flex-wrap">
                            <span className="text-amber-400 font-bold mr-1 hidden sm:inline">A:</span>
                            {[9, 15, 18, 30].map(pts => (
                                <button
                                    key={pts}
                                    onClick={() => setTargetPoints(pts)}
                                    className={`w-9 h-8 rounded-lg font-bold transition-all border ${target === pts
                                            ? 'bg-amber-500 border-amber-300 text-stone-950 shadow-md scale-105'
                                            : 'bg-stone-950 border-stone-800 text-stone-300 hover:border-amber-700'
                                        }`}
                                >
                                    {pts}
                                </button>
                            ))}

                            {/* Puntos Personalizados */}
                            <div className="flex items-center bg-stone-950 rounded-lg border border-stone-800 px-2 py-1">
                                <input
                                    type="number"
                                    placeholder="Otro"
                                    value={customTarget}
                                    onChange={handleCustomTarget}
                                    className="w-12 bg-transparent text-center font-bold text-amber-200 outline-none placeholder:text-stone-600 text-xs"
                                />
                            </div>
                        </div>

                        {/* Acciones Generales */}
                        <div className="flex items-center gap-2">
                            <button
                                onClick={undo}
                                disabled={history.length === 0}
                                className="px-2.5 py-1.5 bg-stone-800 hover:bg-stone-700 disabled:opacity-40 disabled:hover:bg-stone-800 rounded-lg text-amber-200 border border-stone-700 flex items-center gap-1">
                                ↩ Deshacer
                            </button>
                            <button
                                onClick={() => resetGame()}
                                className="px-2.5 py-1.5 bg-red-950/80 hover:bg-red-900 text-red-200 rounded-lg border border-red-800/60 font-semibold">
                                Reiniciar
                            </button>
                        </div>
                    </div>

                    {/* Cartel de Ganador */}
                    {winner && (
                        <div className="my-2 bg-gradient-to-r from-amber-600 via-yellow-500 to-amber-600 p-3 rounded-2xl text-stone-950 font-black text-center text-lg sm:text-xl shadow-xl animate-bounce border-2 border-yellow-200">
                            🏆 ¡¡CANTA RETRUCO Y FESTEJA: {winner.toUpperCase()}!! 🏆
                        </div>
                    )}

                    {/* Mesa de Juego (Paño Verde) */}
                    <div className="felt-table rounded-3xl p-3 sm:p-5 flex-1 flex gap-3 sm:gap-6 relative overflow-hidden">
                        {players.map((player) => (
                            <div
                                key={player.id}
                                className="flex-1 flex flex-col bg-stone-950/40 backdrop-blur-sm rounded-2xl p-2 sm:p-3 border border-emerald-900/50 shadow-inner">

                                {/* Nombre editable */}
                                <input
                                    type="text"
                                    value={player.name}
                                    onChange={(e) => updateName(player.id, e.target.value)}
                                    className="w-full bg-transparent text-center font-truco font-black text-base sm:text-xl text-yellow-300 border-b border-amber-800/50 pb-1 mb-2 outline-none focus:border-yellow-400"
                                />

                                {/* Contador Numérico Central */}
                                <div className="text-center mb-2">
                                    <span className="text-4xl sm:text-5xl font-black font-truco text-amber-100 tracking-tighter drop-shadow-md">
                                        {player.score}
                                    </span>
                                    <span className="text-xs text-amber-400/60 block font-bold">
                                        de {target} pts
                                    </span>
                                </div>

                                {/* Tablero de Fósforos */}
                                <MatchBoard score={player.score} target={target} />

                                {/* Botones de Control (+ / -) */}
                                <div className="flex gap-2 mt-3 pt-2 border-t border-emerald-900/60">
                                    <button
                                        onClick={() => modifyScore(player.id, -1)}
                                        disabled={player.score <= 0}
                                        className="pop-anim flex-1 py-3 bg-red-950/80 hover:bg-red-900 active:bg-red-800 text-red-200 border border-red-700/60 font-black text-xl rounded-xl shadow-md disabled:opacity-30"
                                    >
                                        -1
                                    </button>
                                    <button
                                        onClick={() => modifyScore(player.id, 1)}
                                        disabled={player.score >= target}
                                        className="pop-anim flex-[2] py-3 bg-gradient-to-b from-amber-500 to-amber-700 hover:from-amber-400 hover:to-amber-600 active:from-amber-600 text-stone-950 font-black text-2xl rounded-xl shadow-lg border border-amber-300/40"
                                    >
                                        +1
                                    </button>
                                </div>
                            </div>
                        ))}
                    </div>

                    {/* Footer Tradicional */}
                    <footer className="text-center py-2 text-[11px] text-amber-400/50 font-medium">
                        ¡Envido, Truco, Vale Cuatro! • Diseñado para jugar entre amigos.
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById("root"));
        root.render(<App />);
    </script>
</body>

</html>
